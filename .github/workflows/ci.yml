name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicacao:
    name: Publicação do pack · Node
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check && npm test

  mod:
    name: Astral Modpack · Minecraft 26.3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0
      # build também roda os testes do atualizador (planejamento, aplicação e downloads verificados).
      - run: gradle -p mod build --no-daemon

  instalador:
    name: Instalador · Go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: instalador/go.mod
          cache-dependency-path: instalador/go.sum
      - working-directory: instalador
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./... && go test ./...
      # Confere que todos os sistemas compilam.
      - run: sh scripts/build-instalador.sh 0.0.0 dist https://example.invalid
      - run: sh -n instalar.sh
