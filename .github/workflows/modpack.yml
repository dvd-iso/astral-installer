name: Publicar modpack

# Publicar uma release de modpack atualiza o canal, mesmo quando o anexo chega depois.
# Releases sem .mrpack (como as do antigo aplicativo, tags vX.Y.Z) são ignoradas aqui.
on:
  release:
    types: [published, edited]
  # Reprocessa uma release já publicada, por exemplo depois de corrigir este workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release de modpack (ex.: modpack-20261025-0356)"
        required: true

permissions:
  contents: write

concurrency:
  group: modpack
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar ${{ github.event.release.name || github.event.release.tag_name || inputs.tag }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'modpack-') || contains(join(github.event.release.assets.*.name, ' '), '.mrpack')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0
      - name: Compilar e testar o Astral Modpack
        run: gradle -p mod build --no-daemon
      - name: Limpar e validar o .mrpack e gerar o canal
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release-pack.cjs
      - name: Conferir o pack e todos os downloads
        run: npm run verify:live
      - name: Publicar o canal de atualização
        run: |
          git add channel/stable.json
          if git diff --cached --quiet; then echo "Canal sem mudanças."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Modpack: $(node -p 'require("./channel/stable.json").name')"
          git push origin HEAD:main
