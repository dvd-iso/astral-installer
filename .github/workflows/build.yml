name: Instalar, testar e empacotar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  modpack-guard:
    name: Identificador do modpack · Minecraft 26.3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0
      - run: gradle -p modpack-guard build --no-daemon

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: win
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            target: mac
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            target: mac
            arch: x64
          - name: Linux x64
            os: ubuntu-24.04
            target: linux
            arch: x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      SIGN_WINDOWS: ${{ matrix.target == 'win' && github.event_name != 'pull_request' && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Carregar a interface Electron
        if: matrix.target == 'linux'
        run: xvfb-run --auto-servernum npm start -- --no-sandbox --smoke-test
      - name: Carregar a interface Electron
        if: matrix.target != 'linux'
        run: npm start -- --smoke-test
      - name: Gerar instaladores
        run: npm run build -- --${{ matrix.target }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Conferir a assinatura ad-hoc e abrir o app empacotado
        if: matrix.target == 'mac'
        run: |
          shopt -s nullglob
          apps=(dist/mac*/*.app)
          [ ${#apps[@]} -eq 1 ] || { echo "Esperado um .app em dist/mac*/"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          codesign -dv "${apps[0]}" 2>&1 | grep -q "Signature=adhoc"
          "${apps[0]}/Contents/MacOS/Astral Installer" --smoke-test
      - name: Guardar o instalador sem assinatura
        id: unsigned
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/*.exe
          retention-days: 1
      - name: Assinar pelo SignPath Foundation
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'astral-installer' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Substituir pelo instalador assinado
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          rm dist/*.exe
          cp signed/*.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Astral-Installer-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          retention-days: 14

  release:
    name: Publicar downloads
    needs: [build, modpack-guard]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: Astral-Installer-*
          merge-multiple: true
      - name: Calcular checksums
        working-directory: installers
        run: sha256sum Astral-* > SHA256SUMS.txt
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" installers/* --verify-tag --title "Astral Installer $TAG" --notes-file .github/RELEASE_NOTES.md --generate-notes
