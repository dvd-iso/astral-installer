name: Instalar, testar e empacotar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: win
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            target: mac
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            target: mac
            arch: x64
          - name: Linux x64
            os: ubuntu-24.04
            target: linux
            arch: x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Carregar a interface Electron
        if: matrix.target == 'linux'
        run: xvfb-run --auto-servernum npm start -- --no-sandbox --smoke-test
      - name: Carregar a interface Electron
        if: matrix.target != 'linux'
        run: npm start -- --smoke-test
      - name: Gerar instaladores
        run: npm run build -- --${{ matrix.target }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Astral-Installer-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          retention-days: 14

  release:
    name: Publicar downloads
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Calcular checksums
        working-directory: installers
        run: sha256sum Astral-* > SHA256SUMS.txt
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" installers/* --verify-tag --title "Astral Installer $TAG" --notes-file .github/RELEASE_NOTES.md --generate-notes
